<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conflict Map</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 8px; font-weight: 600; }
    .links { display: flex; gap: 16px; }
    a.card {
      padding: 20px 32px;
      border: 1px solid #444;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.15s;
    }
    a.card:hover { background: #222; }
  </style>
</head>
<body>
  <h1>Conflict Map</h1>
  <div class="links">
    <a class="card" href="./ukraine/">🇺🇦 Ukraine</a>
    <a class="card" href="./lebanon/">🇱🇧 Lebanon</a>
  </div>
</body>
</html>
