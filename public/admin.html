<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>[공정처] 데이터 관리</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <header class="admin-header">
        <h1>📋 상황 데이터 관리</h1>
        <a href="./" class="link-btn">← 지도로 돌아가기</a>
    </header>

    <div class="toolbar">
        <input type="text" id="search-input" placeholder="이름 / 공격주체 / 상세내용 검색...">
        <span id="result-count"></span>
    </div>

    <table id="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>좌표</th>
                <th>공격주체</th>
                <th>발생일시</th>
                <th>상세내용</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="data-tbody"></tbody>
    </table>

    <div class="pagination">
        <button id="prev-page">이전</button>
        <span id="page-info"></span>
        <button id="next-page">다음</button>
    </div>

    <!-- 수정 모달 -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3>📝 상황 정보 수정</h3>
            <input type="hidden" id="edit-id">

            <label>이름</label>
            <input type="text" id="edit-name">

            <label>위도, 경도</label>
            <input type="text" id="edit-coords">

            <div class="datetime-group">
                <div>
                    <label>날짜</label>
                    <input type="date" id="edit-date">
                </div>
                <div>
                    <label>시간</label>
                    <input type="time" id="edit-time">
                </div>
            </div>

            <label>공격 주체</label>
            <div class="attacker-group">
                <input type="radio" name="edit-attacker-radio" id="edit-atk-israel" value="이스라엘군">
                <label for="edit-atk-israel">이스라엘군</label>
                <input type="radio" name="edit-attacker-radio" id="edit-atk-hez" value="헤즈볼라">
                <label for="edit-atk-hez">헤즈볼라</label>
            </div>

            <label>상세내용</label>
            <textarea id="edit-detail"></textarea>

            <div class="modal-buttons">
                <button id="edit-save-btn">저장</button>
                <button id="edit-cancel-btn" class="cancel-btn">취소</button>
            </div>
        </div>
    </div>

    <script src="./admin.js"></script>
</body>

</html>
